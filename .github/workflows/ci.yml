name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Doctor reports the materialization backend
        run: |
          python -m tri doctor | python -c "import json,sys; d=json.load(sys.stdin)['data']['materialization']; print(json.dumps(d['store_volume'], indent=2))"

  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Unit and CLI tests
        shell: bash
        run: python -m unittest discover -s tests -v

  linux-overlay:
    name: linux overlay backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them via AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe overlay support
        run: python -c "from pathlib import Path; import tempfile; from tri.overlay import probe_overlay; print(probe_overlay(Path(tempfile.mkdtemp())))"
      - name: Install bubblewrap for sandboxed runs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Probe sandbox support
        run: python -c "from tri.sandbox import probe; p = probe(); print(p); assert p['isolated'], p"
      - name: Full suite with automatic backend selection (overlay wherever runs are ephemeral)
        run: python -m unittest discover -s tests -v
      - name: Overlay-specific tests with the backend forced
        env:
          TRI_MATERIALIZE_BACKEND: overlay
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -k Overlay -v

  linux-fuse:
    name: linux FUSE virtual checkouts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fuse3 (setuid fusermount3 for unprivileged mounts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 && ls -l /dev/fuse "$(command -v fusermount3)"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe a real unprivileged FUSE mount
        run: python -c "from tri.fuse import probe; p = probe(deep=True); print(p); assert p['available'], p"
      - name: Doctor reports the FUSE backend
        run: |
          python -m tri doctor | python -c "import json,sys; d=json.load(sys.stdin)['data']['virtual_checkouts']; print(d); assert d['available'] and d['backend'] == 'fuse', d"
      - name: Virtual checkout tests (fail instead of skip when FUSE is missing)
        env:
          TRI_REQUIRE_FUSE: "1"
        run: python -m unittest discover -s tests -p "test_virtual_checkout.py" -v
      - name: Full suite with FUSE available
        run: python -m unittest discover -s tests -v
      - name: Virtual checkout benchmark smoke run (2,000 files)
        run: python -m benchmarks.virtual --files 2000 --packages 20 --output-dir "$RUNNER_TEMP/bench-virtual"

  linux-reflink:
    name: linux reflink clones (${{ matrix.fs }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fs: [xfs, btrfs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mount a ${{ matrix.fs }} loopback volume for temp directories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs btrfs-progs
          truncate -s 4G "$RUNNER_TEMP/vol.img"
          if [ "${{ matrix.fs }}" = xfs ]; then mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/vol.img"; else mkfs.btrfs -q "$RUNNER_TEMP/vol.img"; fi
          sudo mkdir -p /mnt/vol
          sudo mount -o loop "$RUNNER_TEMP/vol.img" /mnt/vol
          sudo chown "$USER" /mnt/vol
          echo "TMPDIR=/mnt/vol" >> "$GITHUB_ENV"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe clone support
        run: python -c "from pathlib import Path; from tri.materialize import probe_clone; m = probe_clone(Path('/mnt/vol')); print(m); assert m == 'ficlone', m"
      - name: Bounded-disk tests on reflink clones
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -v

  windows-refs:
    name: windows ReFS block clones
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format a ReFS virtual disk for temp directories
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "refs.vhdx"
          $script = Join-Path $env:RUNNER_TEMP "diskpart.txt"
          @(
            "create vdisk file=$vhd maximum=8192 type=expandable",
            "attach vdisk",
            "create partition primary",
            "format fs=refs quick label=TriRefs",
            "assign letter=R"
          ) | Out-File -Encoding ascii $script
          diskpart /s $script
          New-Item -ItemType Directory -Force R:\tmp | Out-Null
          Get-Volume -DriveLetter R | Format-List FileSystem, Size
          "TMP=R:\tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TEMP=R:\tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe clone support
        run: python -c "from pathlib import Path; from tri.materialize import probe_clone; m = probe_clone(Path(r'R:\tmp')); print(m); assert m == 'refs', m"
      - name: Bounded-disk tests on ReFS block clones
        shell: bash
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -v
