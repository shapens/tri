name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Doctor reports the materialization backend
        run: |
          python -m tri doctor | python -c "import json,sys; d=json.load(sys.stdin)['data']['materialization']; print(json.dumps(d['store_volume'], indent=2))"

  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe the Windows job-object sandbox (low integrity, kill-on-close job)
        shell: bash
        run: python -c "from tri.sandbox import probe; p = probe(); print(p); assert p['kind'] == 'winjob' and p['isolated'], p"
      - name: Unit and CLI tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Windows sandbox tests, verbose
        shell: bash
        run: python -m unittest discover -s tests -p "test_sandbox.py" -v

  linux-gvisor:
    name: linux container sandbox (gVisor runsc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gVisor and register runsc as a Docker runtime
        run: |
          set -eux
          ARCH=$(uname -m)
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          cd "$RUNNER_TEMP"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512" "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' | grep -w runsc
          docker run --rm --runtime=runsc docker.io/library/python:3.11-slim python3 -c "import platform; print(platform.release())"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe the container backend under runsc
        env:
          TRI_RUN_SANDBOX_BACKEND: container
          TRI_RUN_OCI_RUNTIME: runsc
        run: python -c "from tri.sandbox import probe; p = probe(); print(p); assert p['kind'] == 'container' and p['isolated'] and p['runtime'] == 'runsc', p"
      - name: Sandbox probe tests under gVisor (store unreadable, no stray writes, no network, env scrubbed, limits, timeout cleanup)
        env:
          TRI_RUN_SANDBOX_BACKEND: container
          TRI_RUN_OCI_RUNTIME: runsc
        run: python -m unittest discover -s tests -p "test_sandbox.py" -v
      - name: No run container was left behind
        run: test -z "$(docker ps -aq --filter label=tri.sandbox=run)"

  linux-overlay:
    name: linux overlay backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them via AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe overlay support
        run: python -c "from pathlib import Path; import tempfile; from tri.overlay import probe_overlay; print(probe_overlay(Path(tempfile.mkdtemp())))"
      - name: Install bubblewrap for sandboxed runs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Probe sandbox support
        run: python -c "from tri.sandbox import probe; p = probe(); print(p); assert p['isolated'], p"
      - name: Full suite with automatic backend selection (overlay wherever runs are ephemeral)
        run: python -m unittest discover -s tests -v
      - name: Overlay-specific tests with the backend forced
        env:
          TRI_MATERIALIZE_BACKEND: overlay
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -k Overlay -v

  linux-fuse:
    name: linux FUSE virtual checkouts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fuse3 (setuid fusermount3 for unprivileged mounts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 && ls -l /dev/fuse "$(command -v fusermount3)"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe a real unprivileged FUSE mount
        run: python -c "from tri.fuse import probe; p = probe(deep=True); print(p); assert p['available'], p"
      - name: Doctor reports the FUSE backend
        run: |
          python -m tri doctor | python -c "import json,sys; d=json.load(sys.stdin)['data']['virtual_checkouts']; print(d); assert d['available'] and d['backend'] == 'fuse', d"
      - name: Virtual checkout tests (fail instead of skip when FUSE is missing)
        env:
          TRI_REQUIRE_FUSE: "1"
        run: python -m unittest discover -s tests -p "test_virtual_checkout.py" -v
      - name: Full suite with FUSE available
        run: python -m unittest discover -s tests -v
      - name: Virtual checkout benchmark smoke run (2,000 files)
        run: python -m benchmarks.virtual --files 2000 --packages 20 --output-dir "$RUNNER_TEMP/bench-virtual"

  linux-reflink:
    name: linux reflink clones (${{ matrix.fs }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fs: [xfs, btrfs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mount a ${{ matrix.fs }} loopback volume for temp directories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs btrfs-progs
          truncate -s 4G "$RUNNER_TEMP/vol.img"
          if [ "${{ matrix.fs }}" = xfs ]; then mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/vol.img"; else mkfs.btrfs -q "$RUNNER_TEMP/vol.img"; fi
          sudo mkdir -p /mnt/vol
          sudo mount -o loop "$RUNNER_TEMP/vol.img" /mnt/vol
          sudo chown "$USER" /mnt/vol
          echo "TMPDIR=/mnt/vol" >> "$GITHUB_ENV"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe clone support
        run: python -c "from pathlib import Path; from tri.materialize import probe_clone; m = probe_clone(Path('/mnt/vol')); print(m); assert m == 'ficlone', m"
      - name: Bounded-disk tests on reflink clones
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -v

  replicated-storage:
    name: replicated storage (postgres + s3)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tri
          POSTGRES_PASSWORD: tri-ci
          POSTGRES_DB: tri
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tri"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TRI_TEST_DATABASE_URL: postgres://tri:tri-ci@127.0.0.1:5432/tri?sslmode=disable
      TRI_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: triminio
      AWS_SECRET_ACCESS_KEY: triminio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Start MinIO (S3-compatible object storage) and create a bucket
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=triminio -e MINIO_ROOT_PASSWORD=triminio-secret minio/minio server /data
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c "mc alias set local http://127.0.0.1:9000 triminio triminio-secret && mc mb local/tri-ci"
      - name: Multi-node tests (shared PostgreSQL metadata; file and S3 object storage; failover)
        env:
          TRI_TEST_S3_URL: s3://tri-ci/tests
        run: python -m unittest discover -s tests -p test_replicated_storage.py -v
      - name: Full suite with PostgreSQL metadata and S3 object storage
        env:
          TRI_DATABASE_URL: postgres://tri:tri-ci@127.0.0.1:5432/tri?sslmode=disable
          TRI_OBJECT_STORE: s3://tri-ci/suite
        run: python -m unittest discover -s tests -v

  windows-refs:
    name: windows ReFS block clones
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format a ReFS virtual disk for temp directories
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "refs.vhdx"
          $script = Join-Path $env:RUNNER_TEMP "diskpart.txt"
          @(
            "create vdisk file=$vhd maximum=8192 type=expandable",
            "attach vdisk",
            "create partition primary",
            "format fs=refs quick label=TriRefs",
            "assign letter=R"
          ) | Out-File -Encoding ascii $script
          diskpart /s $script
          New-Item -ItemType Directory -Force R:\tmp | Out-Null
          Get-Volume -DriveLetter R | Format-List FileSystem, Size
          "TMP=R:\tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TEMP=R:\tmp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Tri CI"
      - name: Probe clone support
        run: python -c "from pathlib import Path; from tri.materialize import probe_clone; m = probe_clone(Path(r'R:\tmp')); print(m); assert m == 'refs', m"
      - name: Bounded-disk tests on ReFS block clones
        shell: bash
        run: python -m unittest discover -s tests -p "test_bounded_disk.py" -v
