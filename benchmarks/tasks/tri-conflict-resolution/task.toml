version = "1.0"

[metadata]
task_id = "tri-conflict-resolution"
display_title = "Detect and resolve workspace conflicts"
display_description = "Move a target and workspace on the same path, verify Tri records a conflict, then resolve it explicitly."
category = "source_control_workflow"
language = "python"
repository_url = "local:tri"
base_commit_hash = "local"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
docker_image = "local/tri-benchmark:python3.11"
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
