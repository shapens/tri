[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tri-vcs"
version = "0.1.0"
description = "Agent-native source control prototype"
requires-python = ">=3.11"

[project.scripts]
tri = "tri.cli:main"
tri-bench = "benchmarks.agentic:main"
tri-bench-tasks = "benchmarks.task_runner:main"
tri-bench-fanout = "benchmarks.fanout:main"
tri-bench-contention = "benchmarks.contention:main"
tri-bench-virtual = "benchmarks.virtual:main"

[tool.setuptools.packages.find]
include = ["tri*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = [
  "workflow/scenarios/*.json",
  "tasks/*/task.toml",
  "tasks/*/instruction.md",
  "tasks/*/environment/Dockerfile",
  "tasks/*/tests/test.sh",
  "tasks/*/solution/solve.sh",
]
